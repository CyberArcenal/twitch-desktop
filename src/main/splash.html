<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Twitch Desktop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    /* Modern, minimal dark palette */
    :root {
      --bg-depth: #0a0a0c;
      --surface: #141418;
      --twitch: #9146ff;
      --twitch-glow: rgba(145, 70, 255, 0.35);
      --text-primary: #f0f0f4;
      --text-muted: #8e8e9e;
      --accent-line: #2a2a32;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 25% 40%, #121216, var(--bg-depth));
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Very subtle grain texture (optional modern feel) */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      opacity: 0.2;
      pointer-events: none;
    }

    /* Minimal container – centered, no overflow */
    .splash-core {
      text-align: center;
      max-width: 460px;
      width: 86%;
      padding: 2rem 1.5rem;
      z-index: 2;
      animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    }

    /* Icon wrapper – clean glyph */
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(145deg, var(--twitch), #a55eff);
      border-radius: 28px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(145, 70, 255, 0.2);
      margin-bottom: 1.5rem;
    }

    .logo-mark svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    /* App name — crisp & minimal */
    .app-name {
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      background: linear-gradient(120deg, #ffffff, #c6b0ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .tagline {
      font-size: 0.75rem;
      font-weight: 450;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 2rem;
      border-bottom: 1px dashed var(--accent-line);
      display: inline-block;
      padding-bottom: 5px;
    }

    /* Modern slim progress bar */
    .loader-track {
      width: 100%;
      height: 3px;
      background: var(--accent-line);
      border-radius: 10px;
      overflow: hidden;
      margin: 1.5rem 0 1.2rem;
    }

    .loader-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--twitch), #b77cff, var(--twitch));
      background-size: 200% auto;
      border-radius: 10px;
      animation: shimmerFill 2.2s ease-in-out infinite;
    }

    /* single-line status – minimal but meaningful */
    .status-message {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 450;
      color: var(--text-muted);
      background: rgba(20, 20, 24, 0.65);
      backdrop-filter: blur(2px);
      padding: 0.5rem 1rem;
      border-radius: 40px;
      width: fit-content;
      margin: 0.8rem auto 0;
      border: 0.5px solid rgba(145, 70, 255, 0.25);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--twitch);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--twitch);
      animation: pulseDot 1.2s infinite;
    }

    .status-text {
      transition: opacity 0.2s ease;
    }

    /* version - bottom right minimal */
    .version-tiny {
      position: absolute;
      bottom: 20px;
      right: 24px;
      font-size: 0.65rem;
      font-weight: 400;
      color: #52525e;
      letter-spacing: 0.3px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 12px;
      border-radius: 40px;
      backdrop-filter: blur(2px);
      z-index: 2;
    }

    /* animations */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmerFill {
      0% {
        width: 5%;
        background-position: 0% 0%;
      }
      50% {
        width: 78%;
        background-position: 100% 0%;
      }
      100% {
        width: 92%;
        background-position: 200% 0%;
      }
    }

    @keyframes pulseDot {
      0%, 100% {
        opacity: 0.5;
        transform: scale(0.8);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
        background-color: #b77cff;
      }
    }

    /* responsive: everything stays centered, no scroll */
    @media (max-width: 480px) {
      .logo-mark {
        width: 60px;
        height: 60px;
        border-radius: 22px;
      }
      .logo-mark svg {
        width: 36px;
        height: 36px;
      }
      .app-name {
        font-size: 1.7rem;
      }
      .status-message {
        font-size: 0.75rem;
        padding: 0.35rem 0.9rem;
      }
      .version-tiny {
        bottom: 14px;
        right: 16px;
      }
    }
  </style>
</head>
<body>
<div class="splash-core">
  <!-- Icon: modern twitch-like play/glitch silhouette -->
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 3L2 6.5V19H6V21H9L11 19H14L20 13V3H4Z" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M7 7H17L17 12L14 15H11L9 17V15H7V7Z" fill="white" fill-opacity="0.95" stroke="white" stroke-width="0.7"/>
      <circle cx="9.5" cy="10" r="0.8" fill="#0a0a0c"/>
      <circle cx="14.5" cy="10" r="0.8" fill="#0a0a0c"/>
    </svg>
  </div>
  <div class="app-name">Twitch Desktop</div>
  <div class="tagline">stream · chat · native</div>

  <!-- sleek loading bar -->
  <div class="loader-track">
    <div class="loader-fill"></div>
  </div>

  <!-- dynamic status message (simulated essential steps, minimal) -->
  <div class="status-message">
    <span class="status-dot"></span>
    <span id="loadingStatus" class="status-text">Connecting core</span>
  </div>
</div>
<div class="version-tiny">v1.0.0 — beta</div>

<script>
  // Minimal step sequence – only essential & keeps screen clean
  const steps = [
    "⚡ Loading engine",
    "🔐 OAuth ready",
    "📡 Fetching follows",
    "💬 Chat bridge",
    "✨ Almost ready"
  ];

  let stepIndex = 0;
  const statusSpan = document.getElementById("loadingStatus");

  function updateStep() {
    if (stepIndex < steps.length) {
      statusSpan.textContent = steps[stepIndex];
      stepIndex++;
      setTimeout(updateStep, 900);
    } else {
      // final stage: polish and keep simple
      statusSpan.innerHTML = "🎮 Ready — launching";
      const dot = document.querySelector('.status-dot');
      if (dot) dot.style.animation = "none";
      // optional: smooth end indicator (no extra clutter)
    }
  }

  // start sequence after page paint
  window.addEventListener("DOMContentLoaded", () => {
    setTimeout(updateStep, 400);
  });
</script>
</body>
</html>
